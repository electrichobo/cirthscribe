<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CirthScribe</title>
  </head>
  <body data-view="home">
    <main id="home" aria-label="Home"></main>
    <main id="freewrite" aria-label="Free Writing"></main>
    <header class="toolbar" role="toolbar" aria-label="Script tools">
      <!-- One island centred over the script. Icon buttons are filled in by
           main.ts; rarely used settings live in the More (⋮) popover. -->
      <div class="island" id="island">
        <span class="island-group" id="island-nav" role="group" aria-label="Project and history"></span>
        <span class="island-group" id="format-island" role="group" aria-label="Format"></span>
        <span class="island-group" id="island-panels" role="group" aria-label="Panels and tools"></span>
        <button id="view-menu-btn" type="button" class="tool" title="More: view modes, panels, page size, spelling, saving" aria-label="More options"></button>
      </div>
      <div id="more-settings" class="more-settings" role="group" aria-label="Page, spelling and file">
        <label>Page view
          <select id="view-mode" title="Continuous text, or page gaps from the authoritative page map">
            <option value="continuous">Continuous</option>
            <option value="pages">Pages</option>
          </select>
        </label>
        <label>Zoom <input id="zoom" type="range" min="60" max="160" value="100" step="10" aria-label="Editor zoom" /></label>
        <label>Page size
          <select id="profile" title="Stored with this document; pagination, PDF and text export use it"><option value="letter">US Letter</option><option value="a4">A4</option></select>
        </label>
        <label>Spelling
          <select id="spelling" title="Spelling language for this project (Ctrl/Cmd+. for suggestions)">
            <option value="en_US">US English</option>
            <option value="en_GB">UK English</option>
            <option value="off">Off</option>
          </select>
        </label>
        <div class="more-actions">
          <button id="save" type="button" title="Save (Ctrl/Cmd+S). Save As and Export are in the File menu.">Save</button>
          <button id="go-free" type="button" title="Free Writing (your project stays open)">Free Writing</button>
        </div>
      </div>
    </header>
    <main class="panes">
      <nav id="navigator" aria-label="Scene navigator"></nav>
      <section class="editor-wrap" aria-label="Screenplay">
        <div id="find-bar" role="search" aria-label="Find and replace" hidden>
          <input id="find-query" type="search" placeholder="Find" aria-label="Find" />
          <input id="find-replace" type="text" placeholder="Replace with" aria-label="Replace with" />
          <label><input id="find-case" type="checkbox" /> Match case</label>
          <label><input id="find-word" type="checkbox" /> Whole word</label>
          <select id="find-kind" aria-label="Only in block type"></select>
          <span id="find-count" role="status" aria-live="polite"></span>
          <button id="find-prev" type="button" title="Previous (Shift+Enter)" aria-label="Previous match">↑</button>
          <button id="find-next" type="button" title="Next (Enter)" aria-label="Next match">↓</button>
          <button id="find-replace-one" type="button">Replace</button>
          <button id="find-replace-all" type="button">Replace all</button>
          <button id="find-close" type="button" title="Close (Escape)" aria-label="Close find">✕</button>
        </div>
        <div id="banner" role="alert" hidden></div>
        <p id="editor-hint" class="sr-only">Tab and Shift+Tab change the block type; Ctrl+1 to 9 set it directly. Escape goes to the scene list; F6 moves between panels.</p>
        <div id="editor"></div>
      </section>
      <aside id="board" aria-label="Board">
        <label class="toggle board-option"><input id="structural" type="checkbox" /> Board may reorder script</label>
        <div id="board-body"></div>
      </aside>
    </main>
    <footer aria-label="Status bar">
      <strong id="project-title"></strong>
      <span id="status" aria-live="off"></span>
      <span id="file-status" aria-live="off"></span>
      <span id="info"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
