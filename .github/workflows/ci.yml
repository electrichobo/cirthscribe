name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build and test steps go through scripts/ci-step.sh, which turns a failure's
# output into an error annotation (visible without signing in to GitHub).

jobs:
  linux:
    name: Linux (WebKitGTK, WebDriver e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb xclip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Core tests
        run: scripts/ci-step.sh "Core tests (Linux)" cargo test -p cirth-core
      - name: Frontend build
        working-directory: app
        run: ../scripts/ci-step.sh "Frontend build (Linux)" bash -c "npm ci && npm run build"
      - name: Third-party notices up to date
        run: scripts/ci-step.sh "Third-party notices (Linux)" node app/scripts/third-party-notices.mjs --check
      - name: App build
        run: scripts/ci-step.sh "App build (Linux)" cargo build -p cirthscribe --release
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: End-to-end (WebDriver)
        timeout-minutes: 30
        working-directory: app
        run: ../scripts/ci-step.sh "End-to-end (Linux WebDriver)" xvfb-run -a node tests/e2e/run.mjs --driver webdriver --exe ../target/release/cirthscribe --out ../out/e2e-linux.json --screens ../out/screens-linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux
          path: out/
          if-no-files-found: ignore

  windows:
    name: Windows (MSVC build and core tests; e2e non-blocking)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Core tests
        run: scripts/ci-step.sh "Core tests (Windows)" cargo test -p cirth-core
      - name: Frontend build
        working-directory: app
        run: ../scripts/ci-step.sh "Frontend build (Windows)" bash -c "npm ci && npm run build"
      - name: App build
        run: scripts/ci-step.sh "App build (Windows)" cargo build -p cirthscribe --release
      - name: Binary imports (expect no WebView2Loader.dll with MSVC)
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target\release\cirthscribe.exe | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
          $deps
          "::notice title=MSVC binary imports::$($deps -join ', ')"
      - name: WebView2 runtime and matching msedgedriver
        continue-on-error: true
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = $keys | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
          if (-not $v) { $v = 'not installed' }
          "::notice title=WebView2 runtime::$v"
          New-Item -ItemType Directory -Force edgedriver | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip edgedriver -Force
      - name: tauri-driver
        continue-on-error: true
        run: cargo install tauri-driver --locked
      # Open item (docs/M1_PLAN.md 1.3): WebView2 does not start on the hosted
      # Windows runner, so these steps are informational. Windows e2e is a
      # local check (npm run e2e:cdp / e2e:webdriver on a desktop session).
      - name: End-to-end (WebDriver, non-blocking)
        continue-on-error: true
        timeout-minutes: 10
        working-directory: app
        run: ../scripts/ci-step.sh "End-to-end (Windows WebDriver, non-blocking)" node tests/e2e/run.mjs --driver webdriver --deadline-min 8 --exe ../target/release/cirthscribe.exe --out ../out/e2e-windows-webdriver.json --screens ../out/screens-windows-webdriver --native-driver-dir ../edgedriver
      - name: End-to-end (DevTools, non-blocking)
        continue-on-error: true
        timeout-minutes: 10
        working-directory: app
        run: ../scripts/ci-step.sh "End-to-end (Windows DevTools, non-blocking)" node tests/e2e/run.mjs --driver cdp --deadline-min 8 --exe ../target/release/cirthscribe.exe --out ../out/e2e-windows.json --screens ../out/screens-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows
          path: out/
          if-no-files-found: ignore

  macos:
    name: macOS (build and core tests; e2e is manual)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Core tests
        run: scripts/ci-step.sh "Core tests (macOS)" cargo test -p cirth-core
      - name: Frontend build
        working-directory: app
        run: ../scripts/ci-step.sh "Frontend build (macOS)" bash -c "npm ci && npm run build"
      - name: App build
        run: scripts/ci-step.sh "App build (macOS)" cargo build -p cirthscribe --release
